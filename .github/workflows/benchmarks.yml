name: Benchmarks

# Documentation and release metadata cannot change benchmark results.
# Keep both benchmark jobs here so they share these filters. Scheduled and
# manually dispatched runs remain available regardless of changed paths.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
      - run: node --check benchmarks/dashboard.js
      - run: node --test benchmarks/dashboard-data.test.js

  measure:
    name: ${{ matrix.runner }} / Go ${{ matrix.go }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
        go: ${{ fromJSON(github.event_name == 'schedule' && '["1.23.x","1.24.x","1.25.x","1.26.x","stable"]' || '["1.23.x","stable"]') }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      BENCH_RUNNER: ${{ matrix.runner }}
      GO_SELECTOR: ${{ matrix.go }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          # Measure actual PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Measure both revisions on this worker
        if: github.event_name == 'pull_request'
        run: python tooling/benchmarks/run.py --head candidate --base baseline --output results
      - name: Measure main
        if: github.event_name != 'pull_request'
        run: python tooling/benchmarks/run.py --head candidate --output results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.runner }}-${{ matrix.go }}
          path: |
            results/result.json
            results/raw.txt
          retention-days: 30
          if-no-files-found: warn

  linux-arm64-benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      COARSETIME_REQUIRE_VDSO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build syscall baseline and vDSO candidate
        shell: bash
        run: |
          # Fixed pre-vDSO ARM64 revision keeps this comparison reproducible
          # after the feature branch is merged.
          git worktree add --detach "$RUNNER_TEMP/baseline" cfab1351632b48dc33f8830f3dd330b2ea7fed78
          (cd "$RUNNER_TEMP/baseline" && go test -c -o "$RUNNER_TEMP/baseline.test" .)
          go test -c -o "$RUNNER_TEMP/vdso.test" .
      - name: Verify profiling regression test detects the old bridge
        shell: bash
        run: |
          go test -overlay=testdata/profile-regression-overlay.json -c -o "$RUNNER_TEMP/pre-review.test" .
          if "$RUNNER_TEMP/pre-review.test" -test.run '^TestVDSOProfileAttribution$' -test.v > arm64-profile-regression.txt 2>&1; then
            echo 'Old bridge unexpectedly passed the profiling regression test'
            exit 1
          fi
          grep -q 'vDSO samples lost their Go caller' arm64-profile-regression.txt
          "$RUNNER_TEMP/vdso.test" -test.run '^TestVDSOProfileAttribution$' -test.count=5 -test.v
      - name: Verify ARM64 reads do not enter the kernel
        shell: bash
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          strace -f -e trace=clock_gettime -o arm64-vdso.trace "$RUNNER_TEMP/vdso.test" -test.run '^TestVDSO$' -test.bench '^(BenchmarkNowInstant|BenchmarkNow|BenchmarkUnixNano)$' -test.benchtime=100000x
          if grep -q 'clock_gettime(' arm64-vdso.trace; then
            cat arm64-vdso.trace
            exit 1
          fi
          strace -f -e trace=clock_gettime -o arm64-syscall.trace "$RUNNER_TEMP/baseline.test" -test.run '^$' -test.bench '^BenchmarkNowInstant$' -test.benchtime=100x
          grep -q 'clock_gettime(' arm64-syscall.trace
      - name: Validate and measure native ARM64
        shell: bash
        run: |
          set -o pipefail
          {
            uname -a
            lscpu
            go version
            "$RUNNER_TEMP/vdso.test" -test.v
            "$RUNNER_TEMP/vdso.test" -test.run '^TestVDSOConcurrentProfiling$' -test.count=20
            for round in 1 2 3 4 5; do
              cases='baseline vdso'
              if (( round % 2 == 0 )); then cases='vdso baseline'; fi
              for case in $cases; do
                echo "case=$case round=$round"
                "$RUNNER_TEMP/$case.test" -test.run '^$' -test.bench '^Benchmark(NowInstant|Since|TimeSince|TimeNow|Now|UnixNano|LinuxCoarseSyscall)$' -test.benchmem -test.benchtime=500ms
              done
            done
          } 2>&1 | tee arm64-results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-arm64-results
          path: |
            arm64-results.txt
            arm64-*.trace
            arm64-profile-regression.txt
