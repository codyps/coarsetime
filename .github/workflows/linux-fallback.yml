name: Linux fallback benchmark

on: [push, pull_request]

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Measure syscall and Go wall clocks
        shell: bash
        run: |
          set -o pipefail
          {
            uname -a
            lscpu
            go version
            go test -run '^$' -bench '^BenchmarkLinuxWallFallback$' -benchmem -benchtime=500ms -count=10 .
          } 2>&1 | tee results.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-fallback-${{ matrix.os }}-${{ matrix.go }}
          path: results.txt
