name: Linux fallback benchmark

# Match the documentation/release exclusions in benchmarks.yml.
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Validate native Linux
        run: |
          go test ./...
          go test -tags=purego ./...
          go vet ./...
          go test -gcflags=all=-d=checkptr=2 ./...
      - name: Validate 32-bit Linux fallback
        if: matrix.os == 'ubuntu-latest'
        env:
          GOARCH: '386'
        run: go test ./...
      - name: Validate fallback concurrency
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Measure syscall and Go wall clocks
        shell: bash
        run: |
          set -o pipefail
          {
            uname -a
            lscpu
            go version
            go test -run '^$' -bench '^BenchmarkLinux(Wall|Instant)Fallback$' -benchmem -benchtime=500ms -count=10 .
          } 2>&1 | tee results.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-fallback-${{ matrix.os }}-${{ matrix.go }}
          path: results.txt
