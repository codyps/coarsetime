name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    needs: [test, cross-compile]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'codyps/coarsetime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    steps:
      - name: Check Release Please token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::error::Add the RELEASE_PLEASE_TOKEN repository Actions secret.'
            exit 1
          fi
      # An older CI run may finish after a newer push. Let the newer run release.
      - name: Check that this run still represents main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$head_sha" = "$EXPECTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        if: steps.current.outputs.current == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  discover:
    name: Request pkg.go.dev discovery
    needs: [test, cross-compile]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'codyps/coarsetime' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # PAT-created tags trigger this workflow, just like manually pushed tags.
      # The proxy feeds pkg.go.dev; request the exact release after tag CI passes.
      # https://go.dev/doc/modules/publishing
      - name: Fetch tagged module through the public Go proxy
        env:
          GOPROXY: https://proxy.golang.org
          MODULE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go list -m "github.com/codyps/coarsetime@${MODULE_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "::error::Could not request module discovery; rerun this job to retry."
          exit 1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        go: ['1.23.x', stable]
        include:
          - {os: ubuntu-latest, go: '1.24.x'}
          - {os: ubuntu-latest, go: '1.25.x'}
          - {os: ubuntu-latest, go: '1.26.x'}
          - {os: ubuntu-24.04-arm, go: '1.24.x'}
          - {os: ubuntu-24.04-arm, go: '1.25.x'}
          - {os: ubuntu-24.04-arm, go: '1.26.x'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - name: Require Darwin calendar fast path
        if: runner.os == 'macOS'
        run: go test -run '^TestDarwinCalendar' -v .
        env:
          COARSETIME_REQUIRE_DARWIN_WALL: '1'
      - run: go test -tags=purego ./...
      - run: go vet ./...
      - run: go vet -tags=purego ./...
      - name: Race detector
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: go test -race ./...
      - name: Darwin pointer checks
        if: runner.os == 'macOS'
        run: go test -gcflags=all=-d=checkptr=2 ./...
      - name: Pure Go race detector
        if: runner.os == 'Linux'
        run: go test -race -tags=purego ./...
      - name: Linux vDSO bridge
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
          COARSETIME_REQUIRE_VDSO: '1'
        run: |
          go test -count=1 ./...
          go test -count=1 -ldflags='-s -w' ./...
          go test -count=1 -buildmode=pie -trimpath -ldflags='-s -w' ./...
          go test -count=1 -gcflags=all=-d=checkptr=2 ./...
      - name: Windows experiment
        if: runner.os == 'Windows'
        working-directory: research/windows
        run: go test -short ./...

  linux-arm64-benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      COARSETIME_REQUIRE_VDSO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build syscall baseline and vDSO candidate
        shell: bash
        run: |
          # Fixed pre-vDSO ARM64 revision keeps this comparison reproducible
          # after the feature branch is merged.
          git worktree add --detach "$RUNNER_TEMP/baseline" cfab1351632b48dc33f8830f3dd330b2ea7fed78
          (cd "$RUNNER_TEMP/baseline" && go test -c -o "$RUNNER_TEMP/baseline.test" .)
          go test -c -o "$RUNNER_TEMP/vdso.test" .
      - name: Verify profiling regression test detects the old bridge
        shell: bash
        run: |
          go test -overlay=testdata/profile-regression-overlay.json -c -o "$RUNNER_TEMP/pre-review.test" .
          if "$RUNNER_TEMP/pre-review.test" -test.run '^TestVDSOProfileAttribution$' -test.v > arm64-profile-regression.txt 2>&1; then
            echo 'Old bridge unexpectedly passed the profiling regression test'
            exit 1
          fi
          grep -q 'vDSO samples lost their Go caller' arm64-profile-regression.txt
          "$RUNNER_TEMP/vdso.test" -test.run '^TestVDSOProfileAttribution$' -test.count=5 -test.v
      - name: Verify ARM64 reads do not enter the kernel
        shell: bash
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          strace -f -e trace=clock_gettime -o arm64-vdso.trace "$RUNNER_TEMP/vdso.test" -test.run '^TestVDSO$' -test.bench '^(BenchmarkNowInstant|BenchmarkNow|BenchmarkUnixNano)$' -test.benchtime=100000x
          if grep -q 'clock_gettime(' arm64-vdso.trace; then
            cat arm64-vdso.trace
            exit 1
          fi
          strace -f -e trace=clock_gettime -o arm64-syscall.trace "$RUNNER_TEMP/baseline.test" -test.run '^$' -test.bench '^BenchmarkNowInstant$' -test.benchtime=100x
          grep -q 'clock_gettime(' arm64-syscall.trace
      - name: Validate and measure native ARM64
        shell: bash
        run: |
          set -o pipefail
          {
            uname -a
            lscpu
            go version
            "$RUNNER_TEMP/vdso.test" -test.v
            "$RUNNER_TEMP/vdso.test" -test.run '^TestVDSOConcurrentProfiling$' -test.count=20
            for round in 1 2 3 4 5; do
              cases='baseline vdso'
              if (( round % 2 == 0 )); then cases='vdso baseline'; fi
              for case in $cases; do
                echo "case=$case round=$round"
                "$RUNNER_TEMP/$case.test" -test.run '^$' -test.bench '^Benchmark(NowInstant|Since|TimeSince|TimeNow|Now|UnixNano|LinuxCoarseSyscall)$' -test.benchmem -test.benchtime=500ms
              done
            done
          } 2>&1 | tee arm64-results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-arm64-results
          path: |
            arm64-results.txt
            arm64-*.trace
            arm64-profile-regression.txt

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {os: windows, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: '386'}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: '386'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -c -o '${{ runner.temp }}/coarsetime.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
      - run: go test -tags=purego -c -o '${{ runner.temp }}/coarsetime-purego.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
