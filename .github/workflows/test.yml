name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  discover:
    name: Request pkg.go.dev discovery
    needs: [test, cross-compile]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'codyps/coarsetime' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # The proxy feeds pkg.go.dev; request the exact release after CI passes.
      # https://go.dev/doc/modules/publishing
      - name: Fetch tagged module through the public Go proxy
        env:
          GOPROXY: https://proxy.golang.org
          MODULE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go list -m "github.com/codyps/coarsetime@${MODULE_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "::error::Could not request module discovery; rerun this job to retry."
          exit 1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - name: Require Darwin calendar fast path
        if: runner.os == 'macOS'
        run: go test -run '^TestDarwinCalendar' -v .
        env:
          COARSETIME_REQUIRE_DARWIN_WALL: '1'
      - run: go test -tags=purego ./...
      - run: go vet ./...
      - run: go vet -tags=purego ./...
      - name: Race detector
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: go test -race ./...
      - name: Pure Go race detector
        if: runner.os == 'Linux'
        run: go test -race -tags=purego ./...
      - name: Windows experiment
        if: runner.os == 'Windows'
        working-directory: research/windows
        run: go test -short ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {os: windows, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: '386'}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: '386'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -c -o '${{ runner.temp }}/coarsetime.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
      - run: go test -tags=purego -c -o '${{ runner.temp }}/coarsetime-purego.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
