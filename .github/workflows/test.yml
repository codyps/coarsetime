name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    needs: [test, cross-compile]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'codyps/coarsetime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An older CI run may finish after a newer push. Let the newer run release.
      - name: Check that this run still represents main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$head_sha" = "$EXPECTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        if: steps.current.outputs.current == 'true'
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  discover:
    name: Request pkg.go.dev discovery
    needs: [test, cross-compile, release]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.cross-compile.result == 'success' &&
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       needs.release.outputs.release_created == 'true') &&
      github.repository == 'codyps/coarsetime' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # GITHUB_TOKEN-created tags do not trigger another push workflow.
      # The proxy feeds pkg.go.dev; discover both automatic and manual releases.
      # https://go.dev/doc/modules/publishing
      - name: Fetch tagged module through the public Go proxy
        env:
          GOPROXY: https://proxy.golang.org
          MODULE_VERSION: ${{ needs.release.outputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go list -m "github.com/codyps/coarsetime@${MODULE_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "::error::Could not request module discovery; rerun this job to retry."
          exit 1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        go: ['1.23.x', stable]
        include:
          - {os: ubuntu-latest, go: '1.24.x'}
          - {os: ubuntu-latest, go: '1.25.x'}
          - {os: ubuntu-latest, go: '1.26.x'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - name: Require Darwin calendar fast path
        if: runner.os == 'macOS'
        run: go test -run '^TestDarwinCalendar' -v .
        env:
          COARSETIME_REQUIRE_DARWIN_WALL: '1'
      - run: go test -tags=purego ./...
      - run: go vet ./...
      - run: go vet -tags=purego ./...
      - name: Race detector
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: go test -race ./...
      - name: Darwin pointer checks
        if: runner.os == 'macOS'
        run: go test -gcflags=all=-d=checkptr=2 ./...
      - name: Pure Go race detector
        if: runner.os == 'Linux'
        run: go test -race -tags=purego ./...
      - name: Linux vDSO bridge
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
          COARSETIME_REQUIRE_VDSO: '1'
        run: |
          go test -count=1 ./...
          go test -count=1 -ldflags='-s -w' ./...
          go test -count=1 -buildmode=pie -trimpath -ldflags='-s -w' ./...
          go test -count=1 -gcflags=all=-d=checkptr=2 ./...
      - name: Windows experiment
        if: runner.os == 'Windows'
        working-directory: research/windows
        run: go test -short ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {os: windows, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: '386'}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: '386'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -c -o '${{ runner.temp }}/coarsetime.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
      - run: go test -tags=purego -c -o '${{ runner.temp }}/coarsetime-purego.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
