name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - name: Require Darwin calendar fast path
        if: runner.os == 'macOS'
        run: go test -run '^TestDarwinCalendar' -v .
        env:
          COARSETIME_REQUIRE_DARWIN_WALL: '1'
      - run: go test -tags=purego ./...
      - run: go vet ./...
      - run: go vet -tags=purego ./...
      - name: Race detector
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: go test -race ./...
      - name: Darwin pointer checks
        if: runner.os == 'macOS'
        run: go test -gcflags=all=-d=checkptr=2 ./...
      - name: Pure Go race detector
        if: runner.os == 'Linux'
        run: go test -race -tags=purego ./...
      - name: Windows experiment
        if: runner.os == 'Windows'
        working-directory: research/windows
        run: go test -short ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {os: windows, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: '386'}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: '386'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -c -o '${{ runner.temp }}/coarsetime.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
      - run: go test -tags=purego -c -o '${{ runner.temp }}/coarsetime-purego.test' .
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
